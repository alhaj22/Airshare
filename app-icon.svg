<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Display screen 1 -->
  <rect x="76" y="146" width="160" height="110" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="8" filter="url(#glow)"/>
  <rect x="96" y="166" width="120" height="70" rx="8" fill="#0369a1" opacity="0.6"/>
  <rect x="141" y="256" width="30" height="30" fill="#38bdf8"/>
  <rect x="116" y="286" width="80" height="12" rx="6" fill="#38bdf8"/>

  <!-- Display screen 2 -->
  <rect x="276" y="146" width="160" height="110" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="8" filter="url(#glow)"/>
  <rect x="296" y="166" width="120" height="70" rx="8" fill="#7e22ce" opacity="0.6"/>
  <rect x="341" y="256" width="30" height="30" fill="#a855f7"/>
  <rect x="316" y="286" width="80" height="12" rx="6" fill="#a855f7"/>

  <!-- Transfer arrows between screens -->
  <path d="M 210 200 L 302 200" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
  <polygon points="302,185 322,200 302,215" fill="#f8fafc"/>
  <path d="M 302 230 L 210 230" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <polygon points="210,215 190,230 210,245" fill="#38bdf8"/>

  <!-- Mouse Pointer in Center -->
  <path d="M 256 320 L 256 420 L 285 390 L 315 450 L 335 440 L 305 380 L 345 380 Z" fill="#ffffff" stroke="#0f172a" stroke-width="6" filter="url(#glow)"/>
</svg>
